name: renovate

on:
  # saturday 15:00 utc is 1-2am sunday in melbourne, leaving hours for github's delays before the 6am cut-off
  schedule:
    - cron: "0 15 * * 6"
  workflow_dispatch:
    inputs:
      dryRun:
        description: "Dry run: extract, lookup or full; off for a real run"
        type: choice
        options: ["off", "extract", "lookup", "full"]
        default: "off"

# renovate writes with RENOVATE_TOKEN, so the workflow's own token needs nothing
permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: github.repository == 'karshosphere/agent-base'
    runs-on: ubuntu-26.04
    steps:
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
          # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
          renovate-version: 44.155.9@sha256:1b1d9d1137dc0f71e06d8ca830f783af5138113b57e684693a47a37be578ff04
        env:
          RENOVATE_REPOSITORIES: karshosphere/agent-base
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: required
          # renovate skips an empty value, which is what a scheduled run or "off" gives it
          RENOVATE_DRY_RUN: ${{ inputs.dryRun != 'off' && inputs.dryRun || '' }}
